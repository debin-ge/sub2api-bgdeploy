# 公共 proxy 参数（所有站点共用）—— 由 ./bgdeploy render 安装到
# /etc/nginx/sites/snippets/blue-green-proxy.conf。
#
# SSE / WebSocket 语义依赖以下配置。超时值由 sites.yaml 渲染进每个站点配置，
# 运维无需再修改本文件。

proxy_http_version 1.1;
# $bg_connection_upgrade 由 /etc/nginx/sites/http.conf 的 map 统一定义，使用
# 独立变量名以免与服务器现有站点的 $connection_upgrade 冲突。
# 普通请求为空以保持 upstream keepalive；WebSocket 请求为 upgrade。
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $bg_connection_upgrade;

# SSE / 流式响应必须
proxy_buffering off;
proxy_cache off;
proxy_request_buffering off;
gzip off; # 不压缩 SSE
chunked_transfer_encoding on;

# 转发头只从真实 TCP 对端生成，不透传客户端伪造值（FR-6.4）。
# 若 nginx 前还有 CDN，请改用 real_ip_module + set_real_ip_from <CDN CIDR>，
# 参考 deploy/EDGE_SECURITY.md。
proxy_set_header X-Real-IP        $remote_addr;
proxy_set_header X-Forwarded-For  $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header Host             $host;
